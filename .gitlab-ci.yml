stages:
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

build:
  stage: build
  image: node:22
  timeout: 3 minutes
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:3.22
  timeout: 3 minutes
  needs:
    - build
  resource_group: deploy-$CI_COMMIT_REF_SLUG
  environment:
    name: production
    url: https://portfolio.fanaticexplorer.dev
  before_script:
    - apk add --no-cache curl openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -rlgoDzvc --delete -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
    - curl -fsS "https://portfolio.fanaticexplorer.dev" | grep -qi "<title>"
